# Minimal Supabase CLI configuration for NP Wardrobe local development.
# Run `supabase init` in an existing repository first if other Supabase config is needed.
project_id = "np-wardrobe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
enable_signup = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

# Email/password is the configured customer and staff first-factor method.
[auth.email]
enable_signup = true
enable_confirmations = true

# Phone OTP is intentionally disabled until the Nepal SMS provider is selected.
[auth.sms]
enable_signup = false
enable_confirmations = false

# Staff console access requires authenticator-based MFA at AAL2.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
